name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and development tools
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Check lint
        run: python -m ruff check src tests examples benchmarks
      - name: Check formatting
        run: python -m ruff format --check src tests examples benchmarks
      - name: Type check
        if: matrix.python-version == '3.13' && matrix.os == 'ubuntu-latest'
        run: python -m mypy src/envproof
      - name: Build sdist and wheel
        if: matrix.python-version == '3.13' && matrix.os == 'ubuntu-latest'
        run: python -m build
      - name: Check package metadata and artifacts
        if: matrix.python-version == '3.13' && matrix.os == 'ubuntu-latest'
        run: python -m pip install twine && python -m twine check dist/*
