name: Dependency audit

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project and audit tool
        run: python -m pip install --upgrade pip pip-audit && python -m pip install -e ".[dev]"
      - name: Audit installed Python dependencies
        run: pip-audit
