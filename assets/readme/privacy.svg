<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="216" viewBox="0 0 1200 216" role="img" aria-labelledby="t d"><title id="t">EnvProof privacy-first design</title><desc id="d">Environment-variable values are omitted, project source contents are not collected, capture makes no network requests, and Git commit hashes are opt-in.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071321"/><stop offset="1" stop-color="#0B1B2E"/></linearGradient><linearGradient id="teal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#26E7CF"/><stop offset="1" stop-color="#27BFFF"/></linearGradient></defs><rect width="1200" height="216" rx="20" fill="url(#bg)" stroke="#1B5462"/><g transform="translate(27 20)"><path d="M22 0 42 11v24c0 18-11 30-20 36C13 65 2 53 2 35V11Z" fill="#0D3040" stroke="url(#teal)" stroke-width="2.5"/><path d="m12 33 7 7 14-17" fill="none" stroke="#58F1D9" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="58" y="24" fill="#EEFFFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="750">PRIVACY IS A DEFAULT, NOT A CLOUD FEATURE</text><text x="58" y="45" fill="#91BFC5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5">Capture enough evidence to compare environments—without collecting your source code or secret values.</text></g><g transform="translate(27 91)"><rect width="274" height="94" rx="12" fill="#0A2431" stroke="#215A65"/><circle cx="25" cy="25" r="11" fill="#153F4A" stroke="#3ADACB"/><path d="M19 25h12" stroke="#65ECDC" stroke-width="2"/><text x="44" y="28" fill="#EDFFFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="750">ENVIRONMENT VALUES</text><text x="17" y="54" fill="#60E6D0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="750">NOT RECORDED</text><text x="17" y="73" fill="#93BBC5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.5">Presence flags only for selected names.</text><rect x="286" width="274" height="94" rx="12" fill="#0A2431" stroke="#215A65"/><circle cx="311" cy="25" r="11" fill="#153F4A" stroke="#3ADACB"/><path d="m306 20 10 10m0-10-10 10" stroke="#65ECDC" stroke-width="2"/><text x="330" y="28" fill="#EDFFFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="750">SOURCE CONTENT</text><text x="303" y="54" fill="#60E6D0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="750">NOT CAPTURED</text><text x="303" y="73" fill="#93BBC5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.5">Selected manifest hashes only.</text><rect x="572" width="274" height="94" rx="12" fill="#0A2431" stroke="#215A65"/><circle cx="597" cy="25" r="11" fill="#153F4A" stroke="#3ADACB"/><path d="m592 20 10 10m0-10-10 10" stroke="#65ECDC" stroke-width="2"/><text x="616" y="28" fill="#EDFFFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="750">NETWORK REQUESTS</text><text x="589" y="54" fill="#60E6D0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="750">NONE DURING CAPTURE</text><text x="589" y="73" fill="#93BBC5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.5">No telemetry or upload service.</text><rect x="858" width="288" height="94" rx="12" fill="#0A2431" stroke="#215A65"/><circle cx="883" cy="25" r="11" fill="#153F4A" stroke="#3ADACB"/><path d="M877 25h12m-6-6v12" stroke="#65ECDC" stroke-width="2"/><text x="902" y="28" fill="#EDFFFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="750">GIT COMMIT HASH</text><text x="875" y="54" fill="#62DFF6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11.5" font-weight="750">OPT-IN ONLY</text><text x="875" y="73" fill="#93BBC5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.5">Included only by explicit request.</text></g></svg>