<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d"><title id="t">EnvProof — Python environment diagnostics</title><desc id="d">A neon blue and violet visual of two Python environment snapshots being compared to reveal actionable evidence.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050B18"/><stop offset=".56" stop-color="#08172B"/><stop offset="1" stop-color="#15102E"/></linearGradient><linearGradient id="cy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#26E6FF"/><stop offset="1" stop-color="#4385FF"/></linearGradient><linearGradient id="vi" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#687BFF"/><stop offset="1" stop-color="#B077FF"/></linearGradient><pattern id="g" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#20436B" opacity=".38"/></pattern><filter id="blur"><feGaussianBlur stdDeviation="24"/></filter></defs><rect width="1200" height="420" rx="24" fill="url(#bg)"/><rect width="1200" height="420" rx="24" fill="url(#g)"/><circle cx="1060" cy="10" r="170" fill="#177FFF" opacity=".2" filter="url(#blur)"/><circle cx="790" cy="400" r="170" fill="#8554FF" opacity=".14" filter="url(#blur)"/><g transform="translate(55 47)"><path d="M43 0 82 22v44c0 30-20 53-39 65C24 119 4 96 4 66V22Z" fill="#092849" stroke="url(#cy)" stroke-width="3"/><path d="m24 63 13 13 27-32" fill="none" stroke="#75F0FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="104" y="48" fill="#F5FAFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="55" font-weight="750" letter-spacing="-1.8">Env<tspan fill="url(#cy)">Proof</tspan></text><rect x="380" y="12" width="80" height="28" rx="14" fill="#143554" stroke="#2B8DCC"/><text x="420" y="31" text-anchor="middle" fill="#B3EDFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700">v0.1.0</text><text x="106" y="78" fill="#8EB9E1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3">PYTHON ENVIRONMENT DIAGNOSTICS</text><text x="0" y="157" fill="#F0F7FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700">When “works on my machine” fails in CI.</text><text x="0" y="186" fill="#9BB6D3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Capture local evidence. Compare snapshots. Find the next thing to investigate.</text><g transform="translate(0 217)"><rect width="146" height="34" rx="17" fill="#0D2945" stroke="#245B83"/><circle cx="17" cy="17" r="4" fill="#5BE4FF"/><text x="30" y="22" fill="#D8F2FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">LOCAL-FIRST</text><rect x="157" width="176" height="34" rx="17" fill="#0D2945" stroke="#245B83"/><circle cx="174" cy="17" r="4" fill="#57E9BB"/><text x="187" y="22" fill="#D8F2FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">ZERO RUNTIME DEPS</text><rect x="344" width="170" height="34" rx="17" fill="#171D43" stroke="#6059A2"/><circle cx="361" cy="17" r="4" fill="#B18CFF"/><text x="374" y="22" fill="#E1D9FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700">EXPLAINABLE DIFFS</text></g></g><g transform="translate(633 54)"><rect width="515" height="310" rx="18" fill="#050D1A" stroke="#286498" stroke-width="1.5"/><path d="M0 18Q0 0 18 0H497Q515 0 515 18V43H0Z" fill="#102543"/><circle cx="23" cy="21" r="5" fill="#FF718A"/><circle cx="42" cy="21" r="5" fill="#FFD074"/><circle cx="61" cy="21" r="5" fill="#4AE6B8"/><text x="82" y="26" fill="#D7EAFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650">envproof compare</text><g transform="translate(19 61)"><rect width="190" height="95" rx="12" fill="#0C2037" stroke="#2A6498"/><text x="14" y="23" fill="#8DBBE0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="750" letter-spacing="1">BASELINE</text><text