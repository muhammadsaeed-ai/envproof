<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="280" viewBox="0 0 1100 280" role="img" aria-labelledby="t d"><title id="t">Example EnvProof finding</title><desc id="d">Illustrative finding for a Python major and minor version mismatch, showing evidence and a recommended verification step.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08101E"/><stop offset="1" stop-color="#12172D"/></linearGradient><linearGradient id="h" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#FF718D"/><stop offset="1" stop-color="#FFA878"/></linearGradient></defs><rect width="1100" height="280" rx="19" fill="url(#bg)" stroke="#3C456C"/><path d="M0 18Q0 0 18 0H1082Q1100 0 1100 18V52H0Z" fill="#151F37"/><circle cx="23" cy="26" r="5" fill="#FF7A90"/><circle cx="42" cy="26" r="5" fill="#FFD077"/><circle cx="61" cy="26" r="5" fill="#49DDB6"/><text x="81" y="30" fill="#A9BDD8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="650">ILLUSTRATIVE REPORT OUTPUT</text><g transform="translate(25 72)"><rect width="68" height="26" rx="13" fill="#50263A" stroke="url(#h)"/><text x="34" y="17" text-anchor="middle" fill="#FFC1D0" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="800">HIGH</text><text x="85" y="20" fill="#F1F6FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="750">Python major/minor versions differ</text><text x="0" y="52" fill="#94B0CF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.5">RULE ID</text><text x="79" y="52" fill="#75DFFF" font-family="ui-monospace,Consolas,monospace" font-size="12">PYTHON_VERSION_MISMATCH</text></g><g transform="translate(25 154)"><rect width="505" height="78" rx="11" fill="#0A1C30" stroke="#244D75"/><text x="16" y="21" fill="#7EADD5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="750" letter-spacing="1">OBSERVED EVIDENCE</text><text x="16" y="44" fill="#DBE9FA" font-family="ui-monospace,Consolas,monospace" font-size="12.5">Baseline: 3.12.4</text><text x="16" y="63" fill="#DBE9FA" font-family="ui-monospace,Consolas,monospace" font-size="12.5">Current:  3.13.0</text><rect x="520" width="530" height="78" rx="11" fill="#111A31" stroke="#4E467C"/><text x="538" y="21" fill="#B8A8F4" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="750" letter-spacing="1">SUGGESTED NEXT STEP</text><text x="538" y="43" fill="#E5E7FA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Reproduce under the same Python major/minor version</text><text x="538" y="61" fill="#A6A3D5" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">before investigating subtler differences.</text></g><text x="1073" y="261" text-anchor="end" fill="#697F9F" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="9.5">Example only—not a real third-party incident</text></svg>