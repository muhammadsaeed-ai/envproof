<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="268" viewBox="0 0 1200 268" role="img" aria-labelledby="t d"><title id="t">The EnvProof workflow</title><desc id="d">Capture a known-good baseline, capture the failing environment, compare the JSON snapshots, then investigate findings.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071020"/><stop offset="1" stop-color="#0C1A31"/></linearGradient><linearGradient id="c" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#21DFF9"/><stop offset="1" stop-color="#4989FF"/></linearGradient><linearGradient id="v" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#777BFF"/><stop offset="1" stop-color="#B47BFF"/></linearGradient></defs><rect width="1200" height="268" rx="20" fill="url(#bg)" stroke="#1D4067"/><text x="30" y="37" fill="#F0F7FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="750">THE ENVPROOF WORKFLOW</text><text x="1170" y="37" text-anchor="end" fill="#7FA6CD" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">one artifact per environment</text><g transform="translate(26 58)"><rect width="260" height="154" rx="14" fill="#0B1E34" stroke="#286A9D"/><circle cx="29" cy="28" r="15" fill="url(#c)"/><text x="29" y="33" text-anchor="middle" fill="#041726" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800">01</text><text x="53" y="32" fill="#EFF8FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">Capture baseline</text><text x="18" y="60" fill="#90B6D8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Run where the project works.</text><rect x="16" y="82" width="228" height="53" rx="8" fill="#06101E" stroke="#274968"/><text x="28" y="103" fill="#72DFFF" font-family="ui-monospace,Consolas,monospace" font-size="11">envproof capture .</text><text x="28" y="121" fill="#A1B6CF" font-family="ui-monospace,Consolas,monospace" font-size="10">-o baseline.json</text></g><path d="M290 135h16m-7-6 7 6-7 6" stroke="#35DFFF" stroke-width="2" fill="none" stroke-linecap="round"/><g transform="translate(310 58)"><rect width="260" height="154" rx="14" fill="#0B1E34" stroke="#286A9D"/><circle cx="29" cy="28" r="15" fill="url(#c)"/><text x="29" y="33" text-anchor="middle" fill="#041726" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800">02</text><text x="53" y="32" fill="#EFF8FF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">Capture current</text><text x="18" y="60" fill="#90B6D8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Run where it fails.</text><rect x="16" y="82" width="228" height="53" rx="8" fill="#06101E" stroke="#274968"/><text x="28" y="103" fill="#72DFFF" font-family="ui-monospace,Consolas,monospace" font-size="11">envproof capture .</text><text x="28" y="121" fill="#A1B6CF" font-family="ui-monospace,Consolas,monospace" font-size="10">-o current.json</text></g><path d="M574 135h16m-7-6 7 6-7 6" stroke="#35DFFF" stroke-width="2" fill="none" stroke-linecap="round"/><g transform="translate(594 58)"><rect width="260" height="154" rx="14" fill="#151B38" stroke="#685AA8"/><circle cx="29" cy="28" r="15" fill="url(#v)"/><text x="29" y="33" text-anchor="middle" fill="#171031" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800">03</text><text x="53" y="32" fill="#F2EEFF" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">Compare snapshots</text><text x="18" y="60" fill="#B3ACE1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Compare evidence, not guesses.</text><rect x="16" y="82" width="228" height="53" rx="8" fill="#090F22" stroke="#50488B"/><text x="28" y="103" fill="#C5B6FF" font-family="ui-monospace,Consolas,monospace" font-size="11">envproof compare</text><text x="28" y="121" fill="#AFA8DB" font-family="ui-monospace,Consolas,monospace" font-size="10">baseline.json current.json</text></g><path d="M858 135h16m-7-6 7 6-7 6" stroke="#A78AFF" stroke-width="2" fill="none" stroke-linecap="round"/><g transform="translate(878 58)"><rect width="296" height="154" rx="14" fill="#0B202D" stroke="#267D7F"/><circle cx="29" cy="28" r="15" fill="#4DE5BD"/><text x="29" y="33" text-anchor="middle" fill="#05241D" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800">04</text><text x="53" y="32" fill="#ECFFFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700">Investigate</text><text x="18" y="60" fill="#94C8C1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12">Evidence → why → next step.</text><rect x="16" y="82" width="264" height="53" rx="8" fill="#06141F" stroke="#245C65"/><rect x="27" y="94" width="43" height="22" rx="11" fill="#55283C"/><text x="48.5" y="109" text-anchor="middle" fill="#FFC1D1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10" font-weight="800">HIGH</text><text x="82" y="101" fill="#DDEFFA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10.5" font-weight="700">Review strongest clue</text><text x="82" y="116" fill="#8EB6C3" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="10">Then reproduce to confirm it.</text></g><text x="30" y="245" fill="#7596BA" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11">Transfer snapshots only through your approved workflow; review the contents before sharing externally.</text></svg>